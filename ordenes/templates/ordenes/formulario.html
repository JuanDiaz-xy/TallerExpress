{% extends 'ordenes/base.html' %}
{% block contenido %}
<div class="row justify-content-center"><div class="col-lg-8 col-xl-7">
<div class="card border-0 shadow-sm"><div class="card-body p-4">
  <h1 class="h3 mb-4">{{ titulo }}</h1>
  <form method="post" novalidate>
    {% csrf_token %}
    {% if form.non_field_errors %}<div class="alert alert-danger" role="alert">{{ form.non_field_errors }}</div>{% endif %}
    {% for campo in form %}
    <div class="mb-3">
      <label for="{{ campo.id_for_label }}" class="form-label">{{ campo.label }}</label>
      {{ campo }}
      {% if campo.errors %}<div class="text-danger small" role="alert">{{ campo.errors|striptags }}</div>{% endif %}
    </div>
    {% endfor %}
    <div class="d-flex gap-2"><button type="submit" class="btn btn-danger">Guardar</button>
    <a href="{% url 'ordenes:lista' %}" class="btn btn-outline-secondary">Cancelar</a></div>
  </form>
</div></div></div></div>
{% endblock %}
