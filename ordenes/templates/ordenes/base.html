<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TallerExpress | Órdenes de servicio</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root {
      --negro: #111111;
      --gris-oscuro: #1f1f1f;
      --gris: #6b7280;
      --gris-claro: #e5e7eb;
      --blanco: #ffffff;
      --rojo: #c1121f;
      --rojo-oscuro: #9b0d18;
      --rojo-suave: #fff1f2;
    }
    body {
      background: var(--blanco);
      color: var(--negro);
      font-family: Arial, Helvetica, sans-serif;
    }
    .topbar {
      background: var(--negro);
      border-bottom: 4px solid var(--rojo);
    }
    .brand-text small {
      color: rgba(255,255,255,.7);
      display: block;
      font-size: .8rem;
      margin-top: 2px;
    }
    .panel {
      border: 1px solid var(--gris-claro);
      border-radius: 16px;
      background: var(--blanco);
      box-shadow: 0 10px 30px rgba(17,17,17,.06);
    }
    .panel-header {
      border-bottom: 1px solid var(--gris-claro);
      padding-bottom: 14px;
      margin-bottom: 20px;
    }
    .table thead th {
      background: #f7f7f7;
      color: var(--negro);
      border-bottom: 2px solid var(--rojo);
      text-transform: uppercase;
      font-size: .82rem;
      letter-spacing: .02em;
      vertical-align: middle;
    }
    .table td, .table th {
      vertical-align: middle;
    }
    .badge-estado {
      display: inline-block;
      border: 1px solid #f2c6cb;
      background: var(--rojo-suave);
      color: var(--rojo-oscuro);
      padding: .45rem .7rem;
      border-radius: 999px;
      font-size: .8rem;
      font-weight: 600;
    }
    .btn-main {
      background: var(--rojo);
      color: var(--blanco);
      border: 1px solid var(--rojo);
    }
    .btn-main:hover, .btn-main:focus {
      background: var(--rojo-oscuro);
      color: var(--blanco);
      border-color: var(--rojo-oscuro);
    }
    .btn-darkline {
      background: var(--blanco);
      color: var(--negro);
      border: 1px solid var(--negro);
    }
    .btn-darkline:hover, .btn-darkline:focus {
      background: var(--negro);
      color: var(--blanco);
    }
    .btn-soft {
      background: var(--blanco);
      color: var(--rojo);
      border: 1px solid var(--rojo);
    }
    .btn-soft:hover, .btn-soft:focus {
      background: var(--rojo);
      color: var(--blanco);
    }
    .page-link {
      color: var(--negro);
      border-color: var(--gris-claro);
    }
    .page-link:hover {
      color: var(--rojo);
      background: #fafafa;
      border-color: var(--gris-claro);
    }
    .page-item.active .page-link {
      background: var(--rojo);
      border-color: var(--rojo);
      color: var(--blanco);
    }
    .form-label {
      font-weight: 600;
    }
    .form-control:focus, .form-select:focus {
      border-color: #e77d85;
      box-shadow: 0 0 0 .2rem rgba(193,18,31,.12);
    }
    .link-back {
      color: var(--rojo);
      text-decoration: none;
      font-weight: 600;
    }
    .link-back:hover { text-decoration: underline; }
    .helper-text { color: var(--gris); }
  </style>
</head>
<body>
  <header class="topbar mb-4">
    <div class="container py-3 d-flex align-items-center">
      <a href="{% url 'ordenes:lista' %}" class="text-decoration-none d-flex align-items-center">
        <span class="brand-text text-white fw-bold">
          TallerExpress
          <small>Órdenes de servicio</small>
        </span>
      </a>
    </div>
  </header>

  <main class="container pb-5">
    {% if messages %}
      {% for message in messages %}
        <div class="alert alert-{{ message.tags|default:'info' }}" role="status">{{ message }}</div>
      {% endfor %}
    {% endif %}
    {% block contenido %}{% endblock %}
  </main>
</body>
</html>
